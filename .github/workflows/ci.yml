name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Chaves falsas: o build só precisa que as variáveis existam.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci
          VITE_VAPID_PUBLIC_KEY: ci

  # Confere os tipos das Edge Functions (o `tsc` do app não enxerga o Deno). Não bloqueia enquanto
  # não rodou uma vez de ponta a ponta; tire o continue-on-error depois do primeiro verde.
  functions-typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # O package.json da raiz faria o Deno exigir node_modules; os imports já usam o prefixo npm:.
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts
